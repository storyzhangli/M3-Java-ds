# ============================================================================
# D01 Spring AI 初始化与 DeepSeek 接入 - 主配置（可安全入库，仅含无效占位密钥）
# 真实密钥一律通过环境变量注入，禁止把真实 API Key 写入本文件。
# ============================================================================
server:
  port: 8080

spring:
  application:
    name: D29_SpringAI
  # D29 使用应用级 app.ai.* 配置并显式构造 DeepSeek Provider Bean；
  # 关闭供应商自动配置，避免空 Key 在 Mock 模式导致上下文启动失败。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
  # MySQL：D15_PLUS 起作为 Prompt 模板的权威持久化存储。
  # 凭据支持环境变量注入（MYSQL_USER/MYSQL_PASSWORD），冒号后仅为本机开发默认值，生产环境必须通过环境变量覆盖。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ai_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}

  # Spring Boot 3.x Redis 连接配置：模板读缓存 + 多轮会话短期存储。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

  servlet:
    multipart:
      # 与业务层 KnowledgeImportProperties 使用同一环境变量，形成容器与业务双层限制。
      max-file-size: ${KNOWLEDGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${KNOWLEDGE_MAX_REQUEST_SIZE:6MB}

  ai:
    # D29 安全 fallback：应用提供唯一 RetryTemplate Bean；若该 Bean 因装配异常缺失，
    # Spring AI 自动配置也只会执行 1 次，不会回退到默认 10 次。
    retry:
      max-attempts: 1
      on-client-errors: false
      on-http-codes: []
      exclude-on-http-codes:
        - 400
        - 401
        - 402
        - 403
        - 404
        - 408
        - 409
        - 422

# --------------------------------------------------------------------------
# MyBatis-Plus 3.5.x 配置（D15_PLUS 新增）
# --------------------------------------------------------------------------
mybatis-plus:
  configuration:
    # 下划线列名自动映射驼峰字段
    map-underscore-to-camel-case: true
    # 开发期打印 SQL 便于排查，生产环境可通过环境覆盖为 warn
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# --------------------------------------------------------------------------
# D01 应用自定义开关（与 spring.ai.* 官方前缀分离）
# --------------------------------------------------------------------------
app:
  knowledge:
    import:
      # 业务层复核上限，避免直接调用 Service 绕过 Multipart 配置。
      max-file-size: ${KNOWLEDGE_MAX_FILE_SIZE:5MB}
      max-parsed-chars: ${KNOWLEDGE_MAX_PARSED_CHARS:2000000}
      max-pdf-pages: ${KNOWLEDGE_MAX_PDF_PAGES:2000}
      allowed-extensions:
        - txt
        - md
        - markdown
        - html
        - htm
        - pdf
        - docx
    chunking:
      # D29 长度单位统一为 Unicode 码点，不是 Java UTF-16 code unit，也不是 Token。
      default-strategy: ${KNOWLEDGE_CHUNK_STRATEGY:FIXED_LENGTH}
      chunk-size: ${KNOWLEDGE_CHUNK_SIZE:480}
      overlap: ${KNOWLEDGE_CHUNK_OVERLAP:60}
      min-chunk-size: ${KNOWLEDGE_CHUNK_MIN_SIZE:80}
      max-chunk-size: ${KNOWLEDGE_CHUNK_MAX_SIZE:720}
  ai:
    # 单一应用配置源。真实 Key 只通过环境变量/安全配置注入，默认空值。
    mode: ${AI_MODE:mock}
    model: ${AI_MODEL:deepseek-flash}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    temperature: ${AI_TEMPERATURE:0.7}
    # 入参消息可调整长度上限，可用环境变量 AI_CHAT_MAX_LENGTH 覆盖。
    max-message-length: ${AI_CHAT_MAX_LENGTH:2000}
    # SSE 首个/相邻 chunk 的空闲超时（毫秒），不是整个流的总时长。
    stream-timeout-ms: ${AI_STREAM_TIMEOUT_MS:60000}
    # D29 模型 HTTP 超时与唯一同步重试策略。默认最坏预算 80s，小于 90s 总 Deadline。
    model-call:
      connect-timeout: ${AI_MODEL_CONNECT_TIMEOUT:5s}
      response-timeout: ${AI_MODEL_RESPONSE_TIMEOUT:30s}
      total-deadline: ${AI_MODEL_TOTAL_DEADLINE:90s}
      stream-total-timeout: ${AI_MODEL_STREAM_TOTAL_TIMEOUT:180s}
      max-attempts: ${AI_MODEL_MAX_ATTEMPTS:2}
      initial-backoff: ${AI_MODEL_INITIAL_BACKOFF:500ms}
      max-backoff: ${AI_MODEL_MAX_BACKOFF:10s}
      jitter-factor: ${AI_MODEL_BACKOFF_JITTER:0.2}
    # D15_PLUS 新增：Prompt 模板 Redis 缓存（cache-aside，MySQL 始终为权威存储）。
    prompt:
      cache:
        # 关闭后读请求全部直接回源 MySQL，写请求不再执行缓存失效
        enabled: ${PROMPT_CACHE_ENABLED:true}
        key-prefix: ${PROMPT_CACHE_KEY_PREFIX:d15f:prompt:tpl:}
        null-key-suffix: ":null"
        # 正常副本 TTL 30 分钟，命中滑动续期；空值标记 60 秒，抑制缓存穿透
        ttl-seconds: ${PROMPT_CACHE_TTL_SECONDS:1800}
        null-ttl-seconds: ${PROMPT_CACHE_NULL_TTL_SECONDS:60}
    # D15_PLUS 新增：多轮会话 Redis 短期存储，滑动 TTL，到期自动回收。
    # D17 说明：主链路会话权威存储已切换为 MySQL（chat_session/chat_message），
    # 该 Redis 配置与 ConversationMemory 组件保留但不进入主链路，仅作学习资产与兼容参考。
    conversation:
      redis:
        key-prefix: ${CONV_KEY_PREFIX:d15f:conv:}
        ttl-seconds: ${CONV_TTL_SECONDS:1800}
    # ------------------------------------------------------------------
    # D17 新增：对话历史（Chat History）与上下文窗口（Context Window）。
    # 历史完整落 MySQL；窗口按消息条数选取（非 Token 预算），仅 COMPLETED 消息进入模型请求。
    # ------------------------------------------------------------------
    history:
      # 单次模型请求携带的最近历史消息条数，可用环境变量 AI_CONTEXT_WINDOW_MESSAGES 覆盖。
      context-window-messages: ${AI_CONTEXT_WINDOW_MESSAGES:10}
      # 历史查询默认分页大小，上限 100。
      default-page-size: ${AI_HISTORY_PAGE_SIZE:20}
      # 开发身份请求头（无认证项目的归属标识，非生产鉴权）。
      dev-user-header: X-Dev-User
      default-owner: dev-user
      title-max-length: 50
    # ------------------------------------------------------------------
    # D16 新增：思考模式（Thinking Mode）。
    # 经核验 Spring AI 1.1.8 的 DeepSeek 请求体无 thinking/reasoning_effort 字段，
    # 思考开关通过按请求切换 reasoner 模型实现；reasoning_effort 入参由服务端显式拒绝。
    # ------------------------------------------------------------------
    thinking:
      # 思考模式实际使用的推理模型，客户端无法通过请求 DTO 指定任意模型名
      reasoner-model: ${AI_REASONER_MODEL:deepseek-reasoner}
    # ------------------------------------------------------------------
    # D16 新增：最小知识检索（classpath 语料 + 确定性关键词评分，非向量库）。
    # ------------------------------------------------------------------
    knowledge:
      # 单次请求最多组装的引用来源数
      max-sources: ${AI_KNOWLEDGE_MAX_SOURCES:3}
      # 种子语料 classpath 位置
      corpus-location: knowledge/equipment-fault-corpus.json
  # D13 新增：AOP 请求/响应访问日志。敏感字段/头脱敏关键字默认值在 AccessLogProperties 中维护。
  access-log:
    # 正文日志开关，可用 ACCESS_LOG_ENABLED=false 关闭缓存过滤器与切面；TraceId 始终保留。
    enabled: ${ACCESS_LOG_ENABLED:true}
    # 承载 requestId 的请求/响应头名称。
    request-id-header: X-Request-Id
    # D29 响应头别名；与 requestId 同值，明确表示当前本地关联 ID 语义。
    trace-id-header: X-Trace-Id
    # 只复用 1-64 位、字母/数字开头且仅含字母数字下划线中划线的外部 ID；其余重新生成。
    request-id-max-length: ${REQUEST_ID_MAX_LENGTH:64}
    # 单段正文最大字符数，超限截断并在日志中标注 truncated=true。
    max-payload-length: 2048
    # D29：聊天 Prompt/Completion/推理内容按精确字段名整体脱敏，避免误伤 contentType。
    sensitive-exact-fields:
      - message
      - prompt
      - completion
      - content
      - reasoningcontent
      - reasoning_content
    # 不打印访问日志的路径（Ant 风格），requestId 仍正常透传。
    exclude-paths:
      - /error
      - /favicon.ico
      # 设备对话请求/响应包含故障描述和候选摘要，不进入通用正文访问日志。
      - /api/v1/equipment/chat
      # 页面提取接口返回原文文本，不进入通用请求/响应正文日志。
      - /api/v1/knowledge/documents/*/pages
      # Chunk 预览返回原文片段，不进入通用请求/响应正文日志。
      - /api/v1/knowledge/documents/*/chunks
      - /api/v1/knowledge/documents/*/chunks/**
      # D14：SSE 异步流式响应不能被请求/响应缓存包装器缓冲，否则增量无法实时推送且过滤器提前收尾会截断流，
      # 因此整条路径跳过正文缓存过滤器；TraceIdFilter 独立生效，requestId 照常生成与回写。
      - /api/v1/ai/chat/stream
